<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Basic Video Test</title>
</head>
<body>
  <h1>Basic Video Test Page</h1>
  <video id="test-video" width="320" height="240" controls>
    <source src="https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/720/Big_Buck_Bunny_720_10s_1MB.mp4" type="video/mp4">
  </video>
  <audio id="test-audio" controls></audio>
  <script>
    // Add a dynamic video after 500ms
    setTimeout(function() {
      var v = document.createElement('video');
      v.id = 'dynamic-video';
      v.width = 320;
      v.height = 240;
      v.controls = true;
      document.body.appendChild(v);
    }, 500);
  </script>
</body>
</html>
