<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shadow DOM Video Test</title>
</head>
<body>
  <h1>Shadow DOM Video Test Page</h1>
  <div id="host"></div>
  <script>
    (function() {
      var host = document.getElementById('host');
      var shadow = host.attachShadow({ mode: 'open' });
      var h2 = document.createElement('h2');
      h2.textContent = 'Shadow DOM Content';
      shadow.appendChild(h2);
      var v = document.createElement('video');
      v.id = 'shadow-video';
      v.width = 320;
      v.height = 240;
      shadow.appendChild(v);
    })();
  </script>
</body>
</html>
